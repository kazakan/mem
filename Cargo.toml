[package]
name = "mem"
version = "0.0.1"
edition = "2021"
rust-version = "1.80"
description = "Shared project memory for AI agents: decisions, conventions, gotchas and facts in one local SQLite file, searched by a light CLI"
readme = "README.md"
keywords = ["memory", "agents", "sqlite", "fts5", "cli"]
categories = ["command-line-utilities"]
# license = "MIT OR Apache-2.0"   # choose before the first public release (winget needs one)
# repository = "https://github.com/OWNER/mem"
publish = false

[[bin]]
name = "mem"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.42", features = ["bundled"] }
regex = "1"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
indexmap = "2"
# --features embed: EmbeddingGemma through llama.cpp (built from source) + sqlite-vec
llama-cpp-2 = { version = "0.1.161", default-features = false, features = ["static-stdcxx"], optional = true }
llama-cpp-sys-2 = { version = "0.1.161", default-features = false, features = ["static-stdcxx"], optional = true }
sqlite-vec = { version = "0.1.9", optional = true }

[dev-dependencies]
serde = "1"   # golden snapshot writer (MEM_BLESS=1)

[build-dependencies]
cc = "1"

[features]
default = []
embed = ["dep:llama-cpp-2", "dep:llama-cpp-sys-2", "dep:sqlite-vec"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
